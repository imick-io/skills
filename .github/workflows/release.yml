name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm run check-plugin-version

      # With pending changesets: opens or updates the "chore: version skills" PR.
      - id: changesets
        uses: changesets/action@v1
        with:
          version: npm run version
          commit: "chore: version skills"
          title: "chore: version skills"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # With none pending (the version PR was just merged, or nothing changed):
      # release the current version if it isn't tagged yet, then move the major
      # tag projects pin to (@v1). A new major starts a new tag and leaves the
      # old one where it was.
      - name: Release
        if: steps.changesets.outputs.hasChangesets == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "$tag is already released"; exit 0
          fi
          git tag "$tag"
          git push origin "$tag"
          awk -v h="## $version" '$0 == h { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          gh release create "$tag" --title "$tag" --notes-file "$RUNNER_TEMP/notes.md"
          major="v${version%%.*}"
          git tag -f "$major"
          git push -f origin "$major"
